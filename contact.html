<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Site name</title>
  <meta name="description" content="Get in touch with Site name.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Site name</a>
      <nav aria-label="Main">
        <ul class="nav">
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/contact" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-intro">
      <div class="container narrow">
        <h1>Contact</h1>
        <p class="lead">Send us a message and we will get back to you.</p>
      </div>
    </section>

    <section class="section">
      <div class="container narrow">
        <form id="contact-form" class="form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required maxlength="200">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="320">
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required maxlength="5000"></textarea>
          </div>
          <!-- Honeypot: hidden from people, often filled in by bots -->
          <div class="hp" aria-hidden="true">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
          </div>
          <button class="button" type="submit">Send message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span data-year></span> Site name</p>
    </div>
  </footer>
  <script>document.querySelector('[data-year]').textContent = new Date().getFullYear();</script>
  <script src="/contact.js" defer></script>
</body>
</html>
